[project]
name = "ai-powered-investor-intelligence-platform"
version = "0.1.0"
description = "InvestorIQ AI is an AI-powered investor intelligence platform that analyzes financial reports to automatically extract key financial KPIs, business risks, growth drivers, and executive-level insights, while enabling users to ask contextual questions through an interactive AI chat interface."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-core>=1.41.0",
    "azure-search-documents>=12.0.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.1",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.0",
    "openai>=3.7.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]
